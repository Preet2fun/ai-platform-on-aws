[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motadata-msp-agents"
version = "0.1.0"
description = "LangGraph agents for the Motadata MSP AI Assistant on Amazon Bedrock AgentCore"
requires-python = ">=3.11,<3.12"
readme = "README.md"

dependencies = [
    # --- LangGraph / LangChain core ---
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.0",          # Bedrock chat models
    # --- AgentCore runtime + memory + identity ---
    "bedrock-agentcore>=0.1.0",      # AgentCore runtime SDK (App, harness)
    "boto3>=1.35.0",
    # --- MCP servers/clients ---
    "mcp>=1.2.0",
    # --- misc ---
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # --- observability ---
    "aws-opentelemetry-distro>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["libs", "agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agents", "libs"]
