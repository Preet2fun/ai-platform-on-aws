# AgentCore deployment config for dev_cloudwatch_mcp
# Used by scripts/deploy.sh and the AgentCore SDK/CLI build flow.
runtime:
  name: dev_cloudwatch_mcp
  protocol: MCP
  runtime: PYTHON_3_11
  entrypoint: agents/cloudwatch_mcp/cloudwatch_mcp
  network_mode: PUBLIC          # matches deployed state; consider VPC for private tools
  lifecycle:
    idle_session_timeout: 900
    max_lifetime: 28800

artifact:
  s3_bucket: bedrock-agentcore-codebuild-sources-001961766007-us-east-1
  s3_prefix: dev_cloudwatch_mcp/deployment.zip

environment:
  BEDROCK_AGENTCORE_MEMORY_ID: dev_cloudwatch_mcp_mem-cptNOZF8QR
  BEDROCK_AGENTCORE_MEMORY_NAME: dev_cloudwatch_mcp_mem

authorizer:
  type: CUSTOM_JWT
  discovery_url: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vyWBkPHjd/.well-known/openid-configuration
  allowed_clients:
    - 2t0feausc9empnuqq6lgns29bu
  allowed_scopes:
    - mcp-server/invoke

observability:
  otel: true                    # traces to X-Ray / Application Signals
  cloudwatch_logs: true
