# AgentCore deployment config for dev_investigator_a2a_runtime
# Used by scripts/deploy.sh and the AgentCore SDK/CLI build flow.
runtime:
  name: dev_investigator_a2a_runtime
  protocol: A2A
  runtime: PYTHON_3_11
  entrypoint: agents/investigator_a2a/investigator_a2a_runtime
  network_mode: PUBLIC          # matches deployed state; consider VPC for private tools
  lifecycle:
    idle_session_timeout: 900
    max_lifetime: 28800

artifact:
  s3_bucket: bedrock-agentcore-codebuild-sources-001961766007-us-east-1
  s3_prefix: dev_investigator_a2a_runtime/deployment.zip

environment:
  BEDROCK_AGENTCORE_MEMORY_ID: dev_investigator_a2a_runtime_mem-kB61Zn9TLq
  BEDROCK_AGENTCORE_MEMORY_NAME: dev_investigator_a2a_runtime_mem

observability:
  otel: true                    # traces to X-Ray / Application Signals
  cloudwatch_logs: true
