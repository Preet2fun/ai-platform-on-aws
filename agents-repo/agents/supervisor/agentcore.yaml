# AgentCore deployment config for dev_msp_supervisor_agent
# Used by scripts/deploy.sh and the AgentCore SDK/CLI build flow.
runtime:
  name: dev_msp_supervisor_agent
  protocol: HTTP
  runtime: PYTHON_3_11
  entrypoint: agents/supervisor/supervisor_runtime
  network_mode: PUBLIC          # matches deployed state; consider VPC for private tools
  lifecycle:
    idle_session_timeout: 900
    max_lifetime: 28800

artifact:
  s3_bucket: bedrock-agentcore-codebuild-sources-001961766007-us-east-1
  s3_prefix: dev_msp_supervisor_agent/deployment.zip

environment:
  BEDROCK_AGENTCORE_MEMORY_ID: dev_msp_supervisor_agent_mem-C2TMffDFAR
  BEDROCK_AGENTCORE_MEMORY_NAME: dev_msp_supervisor_agent_mem

observability:
  otel: true                    # traces to X-Ray / Application Signals
  cloudwatch_logs: true
