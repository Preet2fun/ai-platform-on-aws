name: eval-gate

# Quality gate for the Cloud Security Knowledge Hub RAG pipeline.
# - Always runs the offline unit tests (ingestion, query-service, evals/tests).
# - On demand, runs the OFFLINE eval against the golden set (collect answers → Bedrock
#   LLM-judge score → quality gate) and fails the build if the gate fails
#   (see evals/lib/gate.py + evals/thresholds.json). This is a pre-release quality gate.
#
# Auth to AWS uses the GitHub OIDC deploy role from infra/06-cicd.yaml (no long-lived keys).

on:
  pull_request:
    paths:
      - "PRODUCTION/use-cases/cloud-security-knowledge-hub/**"
  workflow_dispatch:
    inputs:
      run_ragas:
        description: "Run the RAGAS eval + quality gate against the golden set"
        type: boolean
        default: false

permissions:
  id-token: write      # for AWS OIDC
  contents: read

defaults:
  run:
    working-directory: PRODUCTION/use-cases/cloud-security-knowledge-hub

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install test deps
        run: pip install pytest
      - name: Ingestion tests
        run: python -m pytest ingestion/tests -q
      - name: Query-service tests
        run: python -m pytest query-service/tests -q
      - name: Eval harness tests
        run: python -m pytest evals/tests -q

  ragas-gate:
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ragas }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CSHUB_DEPLOY_ROLE_ARN }}   # from 06-cicd.yaml output
          aws-region: us-east-1
      - name: Install eval + service deps
        run: |
          pip install -r evals/requirements.txt
          pip install -r query-service/requirements.txt
      - name: Run eval (collect from live API → LLM-judge score → gate)
        env:
          CSHUB_API_ENDPOINT: ${{ vars.CSHUB_API_ENDPOINT }}   # from 03-query-service output
          CSHUB_ID_TOKEN: ${{ secrets.CSHUB_EVAL_ID_TOKEN }}    # short-lived Cognito id_token
          AWS_REGION: us-east-1
        run: |
          # OFFLINE eval (golden set → gate): collect answers from the deployed API, then
          # grade against the golden set. Sourcing answers from the deployed API is just an
          # implementation detail (Aurora is in a private VPC); this is a pre-release quality
          # gate against curated ground truth, i.e. OFFLINE eval by the industry definition.
          # 1) collect pipeline outputs over the golden set
          python evals/offline/collect.py \
            --golden evals/golden/golden.jsonl \
            --api "$CSHUB_API_ENDPOINT" --token "$CSHUB_ID_TOKEN" \
            --out results/records.jsonl
          # 2) score accuracy with the Bedrock LLM-judge + emit to CloudWatch
          python evals/offline/score.py \
            --records results/records.jsonl \
            --config baseline --out results/baseline.json --emit-cloudwatch
          # (alternative RAGAS-library path is archived at evals/_archive/run_eval.py;
          #  use it once running inside the VPC on py3.9+ with Aurora reachable.)
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-results, path: PRODUCTION/use-cases/cloud-security-knowledge-hub/results/ }
