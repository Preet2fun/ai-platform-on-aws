AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Security Knowledge Hub - P0 pgvector bootstrap.
  A Lambda-backed CloudFormation custom resource that connects to the Aurora cluster,
  enables the pgvector extension, and creates the hybrid-search schema (dense vector
  column + full-text tsvector column with indexes). Runs once at deploy; safe to re-run.

Parameters:
  ProjectName: { Type: String, Default: cshub }
  EnvName: { Type: String, Default: dev, AllowedValues: [dev, prod] }
  EmbeddingDim:
    Type: Number
    Default: 1024
    Description: Vector dimension (Titan Text Embeddings v2 = 1024).

Resources:
  BootstrapLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-${EnvName}-DbSecretArn"
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-${EnvName}-KmsKeyArn"

  BootstrapLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvName}-pgvector-bootstrap"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt BootstrapLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-LambdaSgId"
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-PrivateSubnetIds"
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbSecretArn"
          DB_ENDPOINT: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbEndpoint"
          DB_NAME: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbName"
          EMBEDDING_DIM: !Ref EmbeddingDim
      Code:
        # This inline handler installs pg8000 (pure-Python Postgres driver, no native build)
        # into /tmp at runtime, then connects to Aurora and runs the idempotent bootstrap DDL.
        # The Lambda runs in the private subnets with NAT egress, so it can reach PyPI.
        # No CI packaging, layer, or S3 artifact needed — the whole thing deploys via deploy.sh.
        # Statements use IF NOT EXISTS / OR REPLACE so re-running (stack update) is safe.
        ZipFile: |
          import json, os, sys, subprocess, urllib.request

          # --- Bootstrap the Postgres driver into /tmp on first invocation ---
          # (Lambda's package dir is read-only; /tmp is writable.) We install FIRST, then add
          # the target dir to sys.path and invalidate import caches so the fresh install is
          # importable in the same process. pip runs via subprocess (available in the Lambda
          # python image); the Lambda has NAT egress to reach PyPI.
          import importlib
          _VENDOR = "/tmp/vendor"
          def _ensure_pg8000():
              try:
                  if _VENDOR not in sys.path:
                      sys.path.insert(0, _VENDOR)
                  importlib.invalidate_caches()
                  import pg8000  # noqa: F401
                  return pg8000
              except ImportError:
                  pass
              subprocess.check_call([
                  sys.executable, "-m", "pip", "install",
                  "--no-cache-dir", "--target", _VENDOR, "pg8000==1.31.2"
              ])
              if _VENDOR not in sys.path:
                  sys.path.insert(0, _VENDOR)
              importlib.invalidate_caches()      # critical: re-scan sys.path after install
              import pg8000  # noqa: F401
              return pg8000

          DDL_STATEMENTS = [
              "CREATE EXTENSION IF NOT EXISTS vector;",
              """
              CREATE TABLE IF NOT EXISTS documents (
                doc_id        TEXT PRIMARY KEY,
                source        TEXT,
                title         TEXT,
                service       TEXT,
                topic         TEXT,
                version       TEXT,
                sensitivity   TEXT,
                created_at    TIMESTAMPTZ DEFAULT now()
              );
              """,
              # NOTE: %(dim)s is substituted in Python before execution (not a SQL param).
              """
              CREATE TABLE IF NOT EXISTS chunks (
                chunk_id      TEXT PRIMARY KEY,
                doc_id        TEXT REFERENCES documents(doc_id) ON DELETE CASCADE,
                chunk_text    TEXT NOT NULL,
                embedding     vector(%(dim)s),
                tsv           tsvector,
                metadata      JSONB,
                created_at    TIMESTAMPTZ DEFAULT now()
              );
              """,
              "CREATE INDEX IF NOT EXISTS chunks_embedding_hnsw ON chunks USING hnsw (embedding vector_cosine_ops);",
              "CREATE INDEX IF NOT EXISTS chunks_tsv_gin ON chunks USING gin (tsv);",
              """
              CREATE OR REPLACE FUNCTION chunks_tsv_update() RETURNS trigger AS $$
              BEGIN
                NEW.tsv := to_tsvector('english', COALESCE(NEW.chunk_text, ''));
                RETURN NEW;
              END; $$ LANGUAGE plpgsql;
              """,
              "DROP TRIGGER IF EXISTS trg_chunks_tsv ON chunks;",
              """
              CREATE TRIGGER trg_chunks_tsv BEFORE INSERT OR UPDATE ON chunks
                FOR EACH ROW EXECUTE FUNCTION chunks_tsv_update();
              """,
          ]

          def _run_ddl():
              import boto3
              pg8000 = _ensure_pg8000()
              sm = boto3.client("secretsmanager")
              sec = json.loads(sm.get_secret_value(SecretId=os.environ["DB_SECRET_ARN"])["SecretString"])
              dim = int(os.environ["EMBEDDING_DIM"])
              conn = pg8000.connect(
                  host=os.environ["DB_ENDPOINT"],
                  database=os.environ["DB_NAME"],
                  user=sec["username"],
                  password=sec["password"],
                  port=int(sec.get("port", 5432)),
                  ssl_context=True,   # Aurora requires TLS
              )
              try:
                  conn.autocommit = True
                  cur = conn.cursor()
                  applied = 0
                  for stmt in DDL_STATEMENTS:
                      cur.execute(stmt % {"dim": dim})
                      applied += 1
                  cur.close()
                  return applied
              finally:
                  conn.close()

          def send(event, context, status, data=None, reason=""):
              body = json.dumps({
                  "Status": status, "Reason": reason or "see CloudWatch logs",
                  "PhysicalResourceId": event.get("LogicalResourceId", "pgvector-bootstrap"),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                          headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      # Schema lives in Aurora (Snapshot on delete); nothing to undo here.
                      return send(event, context, "SUCCESS", {"note": "delete is a no-op"})
                  applied = _run_ddl()
                  print(f"pgvector bootstrap applied {applied} DDL statements")
                  send(event, context, "SUCCESS", {"statements_applied": applied})
              except Exception as e:
                  import traceback; traceback.print_exc()
                  send(event, context, "FAILED", reason=str(e)[:900])

  PgVectorBootstrap:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt BootstrapLambda.Arn

Outputs:
  BootstrapLambdaArn:
    Value: !GetAtt BootstrapLambda.Arn
    Export: { Name: !Sub "${ProjectName}-${EnvName}-PgVectorBootstrapArn" }
