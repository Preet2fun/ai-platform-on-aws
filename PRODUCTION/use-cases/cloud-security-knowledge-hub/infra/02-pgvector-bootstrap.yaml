AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cloud Security Knowledge Hub - P0 pgvector bootstrap.
  A Lambda-backed CloudFormation custom resource that connects to the Aurora cluster,
  enables the pgvector extension, and creates the hybrid-search schema (dense vector
  column + full-text tsvector column with indexes). Runs once at deploy; safe to re-run.

Parameters:
  ProjectName: { Type: String, Default: cshub }
  EnvName: { Type: String, Default: dev, AllowedValues: [dev, prod] }
  EmbeddingDim:
    Type: Number
    Default: 1024
    Description: Vector dimension (Titan Text Embeddings v2 = 1024).

Resources:
  BootstrapLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-${EnvName}-DbSecretArn"
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-${EnvName}-KmsKeyArn"

  BootstrapLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvName}-pgvector-bootstrap"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt BootstrapLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-LambdaSgId"
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-PrivateSubnetIds"
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbSecretArn"
          DB_ENDPOINT: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbEndpoint"
          DB_NAME: !ImportValue
            Fn::Sub: "${ProjectName}-${EnvName}-DbName"
          EMBEDDING_DIM: !Ref EmbeddingDim
      Code:
        # NOTE: this inline handler uses only the stdlib for CFN response handling, but it
        # needs a Postgres driver (pg8266/psycopg) available at runtime. For the real deploy
        # this Lambda is packaged with a psycopg (or pg8000) layer/zip via CI. The inline
        # code documents the exact bootstrap SQL; swap to the packaged artifact in CI.
        ZipFile: |
          import json, os, urllib.request

          DDL = """
          CREATE EXTENSION IF NOT EXISTS vector;

          CREATE TABLE IF NOT EXISTS documents (
            doc_id        TEXT PRIMARY KEY,
            source        TEXT,
            title         TEXT,
            service       TEXT,
            topic         TEXT,
            version       TEXT,
            sensitivity   TEXT,
            created_at    TIMESTAMPTZ DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS chunks (
            chunk_id      TEXT PRIMARY KEY,
            doc_id        TEXT REFERENCES documents(doc_id) ON DELETE CASCADE,
            chunk_text    TEXT NOT NULL,
            embedding     vector(%(dim)s),                         -- dense (pgvector)
            tsv           tsvector,                                -- sparse (full-text)
            metadata      JSONB,
            created_at    TIMESTAMPTZ DEFAULT now()
          );

          -- dense ANN index (cosine). Use HNSW for good recall/latency.
          CREATE INDEX IF NOT EXISTS chunks_embedding_hnsw
            ON chunks USING hnsw (embedding vector_cosine_ops);

          -- sparse full-text index
          CREATE INDEX IF NOT EXISTS chunks_tsv_gin
            ON chunks USING gin (tsv);

          -- keep tsv in sync with chunk_text
          CREATE OR REPLACE FUNCTION chunks_tsv_update() RETURNS trigger AS $$
          BEGIN
            NEW.tsv := to_tsvector('english', COALESCE(NEW.chunk_text, ''));
            RETURN NEW;
          END; $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS trg_chunks_tsv ON chunks;
          CREATE TRIGGER trg_chunks_tsv BEFORE INSERT OR UPDATE ON chunks
            FOR EACH ROW EXECUTE FUNCTION chunks_tsv_update();
          """

          def send(event, context, status, data=None, reason=""):
              body = json.dumps({
                  "Status": status, "Reason": reason or "see CloudWatch logs",
                  "PhysicalResourceId": event.get("LogicalResourceId", "pgvector-bootstrap"),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                          headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      return send(event, context, "SUCCESS")
                  # --- real deploy: packaged psycopg connects and runs DDL ---
                  # import boto3, psycopg
                  # sm = boto3.client("secretsmanager")
                  # sec = json.loads(sm.get_secret_value(SecretId=os.environ["DB_SECRET_ARN"])["SecretString"])
                  # conn = psycopg.connect(host=os.environ["DB_ENDPOINT"], dbname=os.environ["DB_NAME"],
                  #                        user=sec["username"], password=sec["password"], sslmode="require")
                  # with conn, conn.cursor() as cur:
                  #     cur.execute(DDL % {"dim": int(os.environ["EMBEDDING_DIM"])})
                  send(event, context, "SUCCESS", {"note": "package psycopg layer in CI to run DDL"})
              except Exception as e:
                  send(event, context, "FAILED", reason=str(e))

  PgVectorBootstrap:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt BootstrapLambda.Arn

Outputs:
  BootstrapLambdaArn:
    Value: !GetAtt BootstrapLambda.Arn
    Export: { Name: !Sub "${ProjectName}-${EnvName}-PgVectorBootstrapArn" }
